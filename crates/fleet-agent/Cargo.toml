[package]
name = "fleet-agent"
description = "Fleet server agent: gate | exec | bridge | install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fleet-proto.workspace = true
fleet-crypto.workspace = true
fleet-ops.workspace = true
serde.workspace = true
postcard.workspace = true
blake3.workspace = true
redb.workspace = true
# io-std: bridge relays SSH channel stdin/stdout.
tokio = { workspace = true, features = ["io-std"] }
thiserror.workspace = true
hex.workspace = true
# kill(2) for ending sshd sessions of removed devices (no unsafe, no libc).
rustix.workspace = true
# Trusted journal fields of sshd entries (`_UID`, `_COMM`, `CONTAINER_ID`).
serde_json.workspace = true

[dev-dependencies]
fleet-core.workspace = true
tempfile.workspace = true
proptest.workspace = true

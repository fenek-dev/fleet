[package]
name = "fleet-core-ffi"
description = "UniFFI bindings of fleet-core for the Swift app (design §7.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "fleet_core_ffi"
crate-type = ["staticlib", "lib"]

# `uniffi-bindgen` in library mode: `scripts/build-core.sh` runs it on the
# built static library to emit the Swift bindings.
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[lints]
workspace = true

[dependencies]
fleet-core = { workspace = true, features = ["fetch"] }
fleet-proto.workspace = true
futures-util.workspace = true
fleet-crypto.workspace = true
tokio.workspace = true
thiserror.workspace = true
uniffi.workspace = true
hex.workspace = true
# Bulk runs, snippets/runbooks and the MCP socket (design §7.3, §2.3, §8).
fleetctl-proto.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package]
name = "fleet-ops"
description = "Typed operation framework: handlers, registry, system context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fleet-proto.workspace = true
fleet-crypto.workspace = true
fleet-debver.workspace = true
# `compose` (the pure compose.deploy validator, shared with the Mac core).
fleet-compose.workspace = true
# process: child programs (fixed paths, argv only).
tokio = { workspace = true, features = ["process"] }
thiserror.workspace = true
# systemd Manager/Unit over the system bus (services group).
zbus.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# Game templates (profiles/games/*.toml, embedded) and instance records.
toml.workspace = true
x509-parser.workspace = true
sha2.workspace = true
blake3.workspace = true
miniz_oxide.workspace = true
rustix.workspace = true
bollard.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[package]
name = "fleet-core"
description = "Fleet Mac core: agent sessions, command signing, receipt checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fleet-proto.workspace = true
fleet-crypto.workspace = true
tokio.workspace = true
thiserror.workspace = true
russh.workspace = true
russh-sftp.workspace = true
rusqlite.workspace = true
sha2.workspace = true
toml.workspace = true
hex.workspace = true
serde.workspace = true
blake3.workspace = true
# Bulk engine (§7.3), runbooks (§2.3) and the app side of the MCP socket (§8).
fleetctl-proto.workspace = true
serde_json.workspace = true
futures-util.workspace = true
# Vulnerability matching and feeds (design §7.7).
fleet-debver.workspace = true
# `compose_check`: the agent's pure Compose validator.
fleet-compose.workspace = true
flate2.workspace = true
bzip2.workspace = true
reqwest = { workspace = true, optional = true }
# Provisioning: sudo password hashes (`$6$`, design §9.1).
sha-crypt.workspace = true
# cloud-init export (design §9.7): the pure renderer, shared with the agent.
fleet-cloudinit.workspace = true
rustls = { workspace = true, optional = true }

[features]
# The HTTPS feed downloader (`vuln::fetch`). The FFI crate enables it;
# the agent's test harness and fleet-it don't need it.
fetch = ["dep:reqwest", "dep:rustls"]

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

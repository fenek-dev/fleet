[workspace]
resolver = "3"
members = [
    "crates/fleet-proto",
    "crates/fleet-crypto",
    "crates/fleet-agent",
    "crates/fleet-core",
    "crates/fleet-ops",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Every Phase 0 dependency is declared here so member crates only ever write
# `foo.workspace = true` and the root manifest stays stable.
[workspace.dependencies]
# First-party
fleet-proto = { path = "crates/fleet-proto" }
fleet-crypto = { path = "crates/fleet-crypto" }
fleet-core = { path = "crates/fleet-core" }
fleet-ops = { path = "crates/fleet-ops" }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc", "use-std"] }
toml = "1.1.6"
hex = "0.4.3"

# Crypto
blake3 = "1.8.7"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
ecdsa = { version = "0.17.0", features = ["std"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
snow = "0.10.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive"] }
rand = "0.10.3"
rand_core = "0.10.1"
getrandom = "0.4.3"
bip39 = { version = "3.0.0", features = ["zeroize"] }
unicode-normalization = "0.1.25"

# Agent runtime
redb = "4.3.0"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "net", "io-util", "macros", "time", "signal", "sync", "fs"] }
thiserror = "2.0.21"
# statvfs, kill, setpriority without first-party `unsafe` (telemetry, process ops).
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "process"] }

# Mac core
# SSH client (design §3.2). `ring` backend only: no RSA, no zlib, no aws-lc
# C build. Fleet keys are ecdsa-sha2-nistp256 and ssh-ed25519.
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
# Local cache (design §7.4); bundled SQLite so the Mac build has no system dep.
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Test-only
tempfile = "3.27.0"
proptest = "1.11.0"

# Crypto is unusably slow unoptimized (Argon2 with 256 MiB, P-256 verify).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primefield]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.snow]
opt-level = 3

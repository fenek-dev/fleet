# cargo-fuzz targets (see README.md). Not a member of the root workspace:
# it needs a nightly toolchain (pinned in rust-toolchain.toml here).
[package]
name = "fleet-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hex = "0.4"
serde = "1"
fleet-proto = { path = "../crates/fleet-proto" }
fleet-crypto = { path = "../crates/fleet-crypto" }
fleet-ops = { path = "../crates/fleet-ops" }
fleet-hardening = { path = "../crates/fleet-hardening" }
fleet-compose = { path = "../crates/fleet-compose" }
fleet-debver = { path = "../crates/fleet-debver" }
fleet-core = { path = "../crates/fleet-core" }
fleetctl-proto = { path = "../crates/fleetctl-proto" }

# Own workspace, so the root workspace never picks this crate up.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "wire_message"
path = "fuzz_targets/wire_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_command"
path = "fuzz_targets/signed_command.rs"
test = false
doc = false
bench = false


# xcodegen spec. `xcodegen generate` (in this directory) writes
# Fleet.xcodeproj, which is not checked in.
name: Fleet
options:
  bundleIdPrefix: dev.fleet
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  # Terminal emulator view (design §2.3, §7.1). Pinned exactly: it parses
  # untrusted server output, and `FleetTerminalView` filters its replies
  # by their exact byte shapes, so upgrades are reviewed deliberately.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.20.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # The Rust core is built for arm64 only for now.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Fleet:
    type: application
    platform: macOS
    sources:
      - path: Fleet
      # Generated by scripts/build-core.sh (pre-build phase below);
      # gitignored. `optional` so xcodegen works before the first build.
      - path: Generated/fleet_core.swift
        optional: true
        group: Generated
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fleet.Fleet
        PRODUCT_NAME: Fleet
        INFOPLIST_FILE: Fleet/Info.plist
        # scripts/build-app-test.sh overrides this for ad-hoc test builds.
        FLEET_ENTITLEMENTS: Fleet/Fleet.entitlements
        CODE_SIGN_ENTITLEMENTS: $(FLEET_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: YES
        # App Sandbox is off for now: the core opens outbound SSH itself and
        # reads nothing outside the app container, but sandboxing (with the
        # network-client entitlement) is deferred until the MCP socket and
        # file transfer paths are settled.
        ENABLE_APP_SANDBOX: NO
        # The pre-build phase writes into the source tree and target/.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/include
        OTHER_LDFLAGS:
          - $(SRCROOT)/../../target/aarch64-apple-darwin/release/libfleet_core_ffi.a
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          # Test hooks (data dir override, test signer): Debug only.
          # See apple/Fleet/TESTING.md and scripts/check-release-hooks.sh.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG FLEET_TEST_HOOKS"
    preBuildScripts:
      - name: Build Rust core
        script: |
          "${SRCROOT}/../../scripts/build-core.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/fleet_core.swift
          - $(SRCROOT)/Generated/include/fleet_coreFFI.h
          - $(SRCROOT)/../../target/aarch64-apple-darwin/release/libfleet_core_ffi.a
    postBuildScripts:
      # `fleetctl mcp` ships inside the app (Contents/MacOS/fleetctl).
      - name: Build and embed fleetctl
        script: |
          "${SRCROOT}/../../scripts/build-fleetctl.sh"
        basedOnDependencyAnalysis: false

  FleetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FleetTests
    dependencies:
      - target: Fleet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fleet.FleetTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/include
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Fleet.app/Contents/MacOS/Fleet
        BUNDLE_LOADER: $(TEST_HOST)

  FleetUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: FleetUITests
    dependencies:
      - target: Fleet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fleet.FleetUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Fleet

schemes:
  Fleet:
    build:
      targets:
        Fleet: all
        FleetTests: [test]
        FleetUITests: [test]
    test:
      targets:
        - FleetTests
        - FleetUITests

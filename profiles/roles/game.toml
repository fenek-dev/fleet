# Game server role add-on, base part (design §9.6). Per-game templates
# (ports, units, RCON, backups) come later; this sets host tuning only.

[role]
id = "game"
description = "Host tuning for game servers (UDP buffers, backlog)"
modules = ["role.game"]
packages = []
tracked_paths = ["/etc/sysctl.d/90-fleet.conf"]
health_checks = []

[sysctl]
"net.core.rmem_max" = "26214400"
"net.core.wmem_max" = "26214400"
"net.core.rmem_default" = "1048576"
"net.core.wmem_default" = "1048576"
"net.core.netdev_max_backlog" = "5000"

[exceptions]
"role.game.ports" = "public game ports, declared per game"

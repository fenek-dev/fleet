# Fleet runtime and state directories (docs/design.md §4.1, §4.4).
# /run/fleet-exec is root-owned: the gate (group fleet-gate) may traverse it
# and connect to exec.sock, never create, rename or replace entries (a
# gate-writable exec socket dir let a compromised gate plant symlinks that
# root then chmod/chown'ed).
# Type Path                Mode User       Group      Age
d      /run/fleet          0750 fleet-gate fleet      -
d      /run/fleet-exec     0710 root       fleet-gate -
d      /var/lib/fleet/gate 0700 fleet-gate fleet      -
d      /var/lib/fleet/exec 0700 root       root       -

# Installed as /etc/needrestart/conf.d/fleet.conf (design §9.4).
#
# needrestart must never restart Fleet's own units: the agent is restarted
# only through agent.update or its own watchdog. Restarting fleet-exec from
# an apt hook would also cut off the package operation that triggered it.
# The agent binary is static (musl), so library upgrades never require it.
#
# override_rc keys are regexes matched against unit names; 0 = never restart.
$nrconf{override_rc}->{qr(^fleet-)} = 0;
$nrconf{override_rc}->{qr(^fleet@)} = 0;
$nrconf{override_rc}->{qr(^fleet\.)} = 0;
